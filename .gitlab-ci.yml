build-and-test:
  stage: build
  image: ubuntu
  script:
    - cd $CI_BUILDS_DIR
    - cd $CI_PROJECT_DIR
    - apt update
    - apt upgrade -y
    - apt install -y build-essential
    - apt install -y python3-venv python3-dev
    - apt install -y libgdal-dev
    - apt install -y libproj-dev
    - python3 -m venv testenv
    - source ./testenv/bin/activate
    - pip install -v pyproj
    - pip install -v -e .
    - pytest --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: report.xml
  rules:
    - if: $CI_COMMIT_TAG
      when: never 
    - when: always
